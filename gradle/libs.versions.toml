[versions]
agp = "9.3.1"
kotlin = "2.4.21"
composeBom = "2025.12.00"
activityCompose = "1.13.0"
fragment = "1.9.1"
readium = "3.2.0"
room = "3.0.3"
ksp = "2.3.10"
desugarJdkLibs = "2.1.5"
media3 = "1.11.1"
lifecycle = "2.9.4"
androidxCore = "1.17.0"
junit = "4.13.2"
coroutines = "1.10.2"
