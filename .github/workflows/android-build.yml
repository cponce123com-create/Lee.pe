name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "feature/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "scripts/verify_debug_apk.py"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "feature/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "scripts/verify_debug_apk.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""

      - name: Install Android SDK Platform 36
        run: sdkmanager --install "platforms;android-36"

      - name: Verify Spanish and English quote-card resources
        run: python scripts/verify_sharecard_locale_parity.py

      - name: Run unit tests and build APK
        # testDebugUnitTest covers every Android module; :core:domain is a Kotlin/JVM
        # module and would be skipped silently without the explicit task.
        # Avoid parallel packaging of every library test APK; it exhausted the
        # Gradle heap in :feature:library:packageDebugAndroidTest.
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g clean lintDebug testDebugUnitTest :core:domain:test assembleDebug

      - name: Build and smoke-check minified release APK
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g assembleRelease
          python scripts/verify_debug_apk.py app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify packaged quote cards and permissions
        run: python scripts/verify_debug_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Record APK provenance
        run: |
          mkdir -p app/build/outputs/apk/debug
          git rev-parse HEAD > app/build/outputs/apk/debug/commit.txt
          cp version.properties app/build/outputs/apk/debug/version.properties
          sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/SHA256SUMS

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on Android 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g connectedDebugAndroidTest

      - name: Run instrumentation tests on Android 26
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          target: default
          arch: x86
          profile: pixel_2
          script: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g connectedDebugAndroidTest

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lee-pe-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/commit.txt
            app/build/outputs/apk/debug/version.properties
            app/build/outputs/apk/debug/SHA256SUMS
            core/database/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14
