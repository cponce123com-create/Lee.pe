name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "feature/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "feature/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK Platform 36
        run: sdkmanager --install "platforms;android-36"

      - name: Run unit tests and build APK
        # testDebugUnitTest covers every Android module; :core:domain is a Kotlin/JVM
        # module and would be skipped silently without the explicit task.
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest :core:domain:test assembleDebug assembleDebugAndroidTest

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lee-pe-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            core/database/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14
