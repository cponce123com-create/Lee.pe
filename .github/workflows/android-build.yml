name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""

      - name: Install Android SDK Platform 36
        run: sdkmanager --install "platforms;android-36"

      - name: Test APK manifest security policy
        run: python scripts/test_verify_debug_apk.py

      - name: Test signing certificate checks and exception resource policy
        run: |
          python scripts/test_verify_release_signing.py
          python scripts/test_coverage_summary.py
          python scripts/verify_exception_resources.py

      - name: Verify Spanish and English quote-card resources
        run: python scripts/verify_sharecard_locale_parity.py

      - name: Run unit tests and build APK
        # testDebugUnitTest covers every Android module; :core:domain is a Kotlin/JVM
        # module and would be skipped silently without the explicit task.
        # Avoid parallel packaging of every library test APK; it exhausted the
        # Gradle heap in :feature:library:packageDebugAndroidTest.
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g lintDebug testDebugUnitTest :core:domain:test assembleDebug koverHtmlReportAll

      - name: Build and smoke-check minified release APK
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g lintRelease assembleRelease
          # Release verification rejects every debug-only Compose host.
          python scripts/verify_debug_apk.py app/build/outputs/apk/release/app-release-unsigned.apk --variant release

      - name: Verify packaged quote cards and permissions
        # Debug verification allows only the two exact filterless Compose test hosts.
        run: python scripts/verify_debug_apk.py app/build/outputs/apk/debug/app-debug.apk --variant debug

      - name: Record APK provenance
        id: apk_info
        run: |
          mkdir -p app/build/outputs/apk/debug
          version="$(sed -n 's/^versionName=//p' version.properties)"
          short_commit="$(git rev-parse --short=8 HEAD)"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Lee-pe-${version}-${short_commit}-debug.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > app/build/outputs/apk/debug/commit.txt
          cp version.properties app/build/outputs/apk/debug/version.properties
          sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation-and-coverage
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lee-pe-debug-${{ steps.apk_info.outputs.version }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/commit.txt
            app/build/outputs/apk/debug/version.properties
            app/build/outputs/apk/debug/SHA256SUMS
            core/database/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Evaluate requested coverage goals
        id: coverage_goals
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace --continue coverageGoals koverXmlReportAll
      - name: Record coverage goal status
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage_goals.outcome }}
        run: |
          python3 scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage goals: $COVERAGE_OUTCOME (targets: domain 60%, data 50%, features 40%, app 30%)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$COVERAGE_OUTCOME" != success ]; then
            echo "::warning::Coverage targets are not verified as achieved; inspect the XML/HTML reports."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-goals
          path: '**/build/reports/kover/'
          retention-days: 30

  instrumentation:
    name: Instrumentation API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            arch: x86
          - api: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ""
      - run: sdkmanager --install "platforms;android-36"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash scripts/run_instrumentation.sh
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumentation-api-${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            build/device-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  notify-failure:
    needs: [build, instrumentation]
    if: always() && github.event_name == 'push' && (needs.build.result == 'failure' || needs.instrumentation.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify configured team webhook
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          webhook = os.environ.get('SLACK_WEBHOOK')
          if webhook:
              payload = json.dumps({'text': 'Falló el CI de Lee.pe: ' + os.environ['RUN_URL']}).encode()
              request = urllib.request.Request(webhook, data=payload, headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
          else:
              print('Notificación no configurada: falta SLACK_WEBHOOK.')
          PYTHON
