name: Quality reports
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-analysis:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36'
      - name: Check style and static analysis
        id: initial
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace --continue ktlintCheck detekt
      - name: Correct formatting
        if: steps.initial.outcome == 'failure'
        run: ./gradlew --no-daemon --stacktrace ktlintFormat
      - name: Record formatting patch
        if: always()
        run: |
          mkdir -p build/reports
          git diff --binary > build/reports/formatting.patch
      - name: Require clean style and static analysis
        run: ./gradlew --no-daemon --stacktrace --continue ktlintCheck detekt
      - name: Generate API documentation
        run: ./gradlew --no-daemon :core:domain:dokkaGenerate
      - name: Commit corrected formatting to trusted PR
        id: format_commit
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.initial.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.head_ref }}
          commit_message: 'style: apply ktlint formatting'
          file_pattern: '*.kt *.kts'
      # GITHUB_TOKEN pushes do not create a new push workflow. Explicitly
      # validate the resulting head so its checks are not left pending.
      - name: Validate automatic commit
        if: steps.format_commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          gh workflow run quality.yml --ref "$TARGET_BRANCH"
          gh workflow run android-build.yml --ref "$TARGET_BRANCH"
      - name: Upload analysis and API documentation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-analysis-and-domain-api
          path: |
            **/build/reports/detekt*
            **/build/reports/ktlint/
            config/detekt/baseline.xml
            core/domain/build/dokka/
            build/reports/formatting.patch
          retention-days: 30
  dependency-audit:
    # Fork PRs have no secrets. This audit runs on trusted main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36'
      - name: Audit resolved dependencies (CVSS >= 7 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon --stacktrace dependencyCheckAggregate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: build/reports/dependency-check-report.*
          retention-days: 30

  benchmarks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure startup, scroll and EPUB opening
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g -PenableBenchmarks=true -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR :benchmark:connectedBenchmarkAndroidTest
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macrobenchmark-api35-emulator
          path: |
            benchmark/build/outputs/
            benchmark/build/reports/
          retention-days: 30
