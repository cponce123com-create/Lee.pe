name: Quality reports
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36'
      - name: Static analysis and API documentation
        run: ./gradlew --no-daemon --stacktrace --continue detekt ktlintCheck :core:domain:dokkaGenerate
      - name: Upload analysis and API documentation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-analysis-and-domain-api
          path: |
            **/build/reports/detekt*
            **/build/reports/ktlint/
            core/domain/build/dokka/
          retention-days: 30
  dependency-audit:
    # Fork PRs have no secrets. This audit runs on trusted main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36'
      - name: Audit resolved dependencies (CVSS >= 7 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon --stacktrace dependencyCheckAggregate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: build/reports/dependency-check-report.*
          retention-days: 30
