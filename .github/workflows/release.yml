name: Release bundle

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag and version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^versionName=//p' version.properties)"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Use vMAJOR.MINOR.PATCH matching versionName in version.properties."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK and verify signing when configured
        id: build
        env:
          LEE_PE_KEYSTORE_BASE64: ${{ secrets.LEE_PE_KEYSTORE_BASE64 }}
          LEE_PE_KEYSTORE_PASSWORD: ${{ secrets.LEE_PE_KEYSTORE_PASSWORD }}
          LEE_PE_KEY_ALIAS: ${{ secrets.LEE_PE_KEY_ALIAS }}
          LEE_PE_KEY_PASSWORD: ${{ secrets.LEE_PE_KEY_PASSWORD }}
          LEE_PE_SIGNING_CERT_SHA256: ${{ vars.LEE_PE_SIGNING_CERT_SHA256 }}
        run: |
          signed=false
          tasks=(testDebugUnitTest :core:domain:test lintRelease assembleRelease)
          if [[ -n "$LEE_PE_KEYSTORE_BASE64$LEE_PE_KEYSTORE_PASSWORD$LEE_PE_KEY_ALIAS$LEE_PE_KEY_PASSWORD$LEE_PE_SIGNING_CERT_SHA256" ]]; then
            if [[ -z "$LEE_PE_KEYSTORE_BASE64" || -z "$LEE_PE_KEYSTORE_PASSWORD" || -z "$LEE_PE_KEY_ALIAS" ||
                  -z "$LEE_PE_KEY_PASSWORD" || -z "$LEE_PE_SIGNING_CERT_SHA256" ]]; then
              echo "::error::Incomplete signing configuration. See docs/FIRMA_APK.md."
              exit 1
            fi
            umask 077
            export LEE_PE_KEYSTORE="$RUNNER_TEMP/lee-pe-release.jks"
            printf '%s' "$LEE_PE_KEYSTORE_BASE64" | base64 -d > "$LEE_PE_KEYSTORE"
            signed=true
            tasks+=(bundleRelease)
          fi
          unset LEE_PE_KEYSTORE_BASE64
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false "${tasks[@]}"
          if [[ "$signed" == true ]]; then
            python3 scripts/verify_release_signing.py app/build/outputs/apk/release
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lee-pe-release.jks"

      - name: Stage assets and checksums
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "::error::Expected exactly one release APK."; exit 1; }
          mkdir -p dist
          if [[ "$SIGNED" == true ]]; then
            cp "${apks[0]}" dist/
            cp app/build/outputs/apk/release/signing.json dist/
            cp app/build/outputs/bundle/release/*.aab dist/
          else
            cp "${apks[0]}" dist/lee-pe-release-unsigned.apk
          fi
          cp version.properties dist/
          (cd dist && files=(*) && sha256sum -- "${files[@]}" > SHA256SUMS)

      - name: Prepare release notes
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md")
          notes = ""
          if changelog.is_file():
              version = re.escape(tag.removeprefix("v"))
              pattern = rf"^##\s+\[?v?{version}\]?(?:[ \t]+[^\n]*)?\n(.*?)(?=^##\s|\Z)"
              match = re.search(pattern, changelog.read_text(encoding="utf-8"), re.M | re.S)
              if match:
                  notes = match.group(1).strip()
          if not notes:
              previous = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "--match", "v*.*.*", "HEAD^"],
                  capture_output=True, text=True, check=False,
              ).stdout.strip()
              revision = f"{previous}..HEAD" if previous else "HEAD"
              notes = "## Cambios recientes\n\n" + subprocess.check_output(
                  ["git", "log", "--no-merges", "-20", "--format=- %h %s", revision],
                  text=True,
              ).strip()
          if os.environ["SIGNED"] != "true":
              notes = "> APK sin firma. Requiere firma antes de instalarlo.\n\n" + notes
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PYTHON

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

    outputs:
      signed: ${{ steps.build.outputs.signed }}

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lee.pe ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.signed != 'true' }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
