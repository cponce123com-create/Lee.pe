name: Release bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require persistent signing configuration
        env:
          LEE_PE_KEYSTORE_BASE64: ${{ secrets.LEE_PE_KEYSTORE_BASE64 }}
          LEE_PE_KEYSTORE_PASSWORD: ${{ secrets.LEE_PE_KEYSTORE_PASSWORD }}
          LEE_PE_KEY_ALIAS: ${{ secrets.LEE_PE_KEY_ALIAS }}
          LEE_PE_KEY_PASSWORD: ${{ secrets.LEE_PE_KEY_PASSWORD }}
          LEE_PE_SIGNING_CERT_SHA256: ${{ vars.LEE_PE_SIGNING_CERT_SHA256 }}
        run: |
          python - <<'PYTHON'
          import os, re
          names = ('LEE_PE_KEYSTORE_BASE64', 'LEE_PE_KEYSTORE_PASSWORD', 'LEE_PE_KEY_ALIAS', 'LEE_PE_KEY_PASSWORD', 'LEE_PE_SIGNING_CERT_SHA256')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Release requires persistent signing configuration: ' + ', '.join(missing))
          fingerprint = os.environ['LEE_PE_SIGNING_CERT_SHA256'].replace(':', '').lower()
          if not re.fullmatch('[0-9a-f]{64}', fingerprint):
              raise SystemExit('LEE_PE_SIGNING_CERT_SHA256 must be a SHA-256 certificate fingerprint.')
          PYTHON

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""

      - name: Install Android SDK Platform 36
        run: sdkmanager --install "platforms;android-36"

      - name: Export signing variables
        # Release never falls back to an unsigned package or an ephemeral debug key.
        env:
          LEE_PE_KEYSTORE_BASE64: ${{ secrets.LEE_PE_KEYSTORE_BASE64 }}
          LEE_PE_KEYSTORE_PASSWORD: ${{ secrets.LEE_PE_KEYSTORE_PASSWORD }}
          LEE_PE_KEY_ALIAS: ${{ secrets.LEE_PE_KEY_ALIAS }}
          LEE_PE_KEY_PASSWORD: ${{ secrets.LEE_PE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$LEE_PE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lee-pe-release.jks"
          echo "LEE_PE_KEYSTORE=$RUNNER_TEMP/lee-pe-release.jks" >> "$GITHUB_ENV"

      - name: Run tests and build the bundle
        env:
          LEE_PE_KEYSTORE_PASSWORD: ${{ secrets.LEE_PE_KEYSTORE_PASSWORD }}
          LEE_PE_KEY_ALIAS: ${{ secrets.LEE_PE_KEY_ALIAS }}
          LEE_PE_KEY_PASSWORD: ${{ secrets.LEE_PE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest :core:domain:test lintRelease bundleRelease assembleRelease

      - name: Verify signed APK certificate
        env:
          LEE_PE_SIGNING_CERT_SHA256: ${{ vars.LEE_PE_SIGNING_CERT_SHA256 }}
        run: python scripts/verify_release_signing.py app/build/outputs/apk/release

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lee-pe-release.jks"

      - name: Upload signed APK and certificate provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lee-pe-signed-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/signing.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lee-pe-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create signed GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Lee.pe $RELEASE_TAG" app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
          fi
