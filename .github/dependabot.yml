version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    open-pull-requests-limit: 3
    groups:
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
      kotlin-ksp:
        applies-to: version-updates
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
        update-types: [minor, patch]
      android-build:
        applies-to: version-updates
        patterns: ["com.android.tools.build:gradle", "com.android.application*", "com.android.library*", "com.android.test*"]
        update-types: [minor, patch]
      compose-bom:
        applies-to: version-updates
        patterns: ["androidx.compose:compose-bom"]
        update-types: [minor, patch]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
